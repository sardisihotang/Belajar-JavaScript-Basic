<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Membuat Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Game Suwit</h1>

    <div class="container">
      <div class="area-komputer">
        <img src="image/gajah.png" class="img-computer" />
      </div>
      <div class="info"></div>
      <div class="area-player">
        <ul>
          <li>
            <img src="image/gajah.png" class="gajah" />
          </li>
          <li>
            <img src="image/orang.png" class="orang" />
          </li>
          <li>
            <img src="image/semut.png" class="semut" />
          </li>
        </ul>
      </div>
      <div class="scoreboard">
        <p>Menang: <span id="win-count">0</span></p>
        <p>Kalah: <span id="loss-count">0</span></p>
        <p>Seri: <span id="draw-count">0</span></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
